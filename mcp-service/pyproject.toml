[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-service"
version = "0.1.0"
description = "Protected MCP currency conversion service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=2.3.0,<3.0.0",
    "pydantic-settings>=2.10.0",
]

[project.scripts]
mcp-service = "mcp_service.main:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["mcp_service"]
